<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수업용 모둠 나누기</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --success: #10b981;
      --radius: 16px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* 상단 헤더 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease-in-out;
      user-select: none;
    }

    .btn-outline {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca, #3730a3);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-lg {
      padding: 16px 36px;
      font-size: 20px;
      border-radius: 14px;
      font-weight: 700;
    }

    /* 설정 패널 */
    .settings-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px 28px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 15px;
      font-weight: 600;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-label span.hint {
      font-size: 12px;
      font-weight: normal;
      color: var(--text-muted);
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-control {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      background-color: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: all 0.15s ease;
    }

    .input-control:focus {
      background-color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .number-stepper {
      display: flex;
      align-items: center;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .number-stepper input {
      border: none;
      background: transparent;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      width: 70px;
      height: 44px;
      outline: none;
      color: var(--text);
    }

    .stepper-btn {
      width: 44px;
      height: 44px;
      background: #ffffff;
      border: none;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
    }

    .stepper-btn:hover {
      background: #e2e8f0;
      color: var(--text);
    }

    /* 결석자 선택 번호판 칩 */
    .chip-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .chip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chip-header-title {
      font-size: 14px;
      font-weight: 600;
      color: #475569;
    }

    .chip-legend {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .legend-dot.present { background-color: #3b82f6; }
    .legend-dot.absent { background-color: var(--danger); }

    .chips-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      max-height: 140px;
      overflow-y: auto;
      padding: 4px;
    }

    .student-chip {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      border: 1.5px solid transparent;
    }

    .student-chip.present {
      background-color: #f1f5f9;
      color: #334155;
      border-color: #e2e8f0;
    }

    .student-chip.present:hover {
      background-color: #e2e8f0;
      transform: translateY(-1px);
    }

    .student-chip.absent {
      background-color: var(--danger-light);
      color: #b91c1c;
      border-color: #fca5a5;
      text-decoration: line-through;
    }

    .student-chip.absent:hover {
      background-color: #fecaca;
    }

    /* 요약 안내바 */
    .summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 20px;
      background-color: var(--primary-light);
      border: 1px solid #c7d2fe;
      border-radius: 12px;
      font-size: 15px;
      color: #3730a3;
      font-weight: 600;
    }

    .summary-text {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .summary-badge {
      display: inline-block;
      padding: 3px 10px;
      background: white;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .action-cta-area {
      display: flex;
      justify-content: center;
      padding-top: 6px;
    }

    /* 결과 영역 */
    .result-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 4px 4px;
    }

    .result-title {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
    }

    .result-actions {
      display: flex;
      gap: 10px;
    }

    /* 모둠 카드 그리드 */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .group-card {
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 2px solid transparent;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .group-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .group-card-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .group-name {
      font-size: 19px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .group-size-tag {
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
    }

    .group-card-body {
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
      min-height: 120px;
    }

    /* 학생 번호 카드 */
    .student-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 58px;
      height: 48px;
      padding: 0 16px;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 800;
      color: #1e293b;
      box-shadow: var(--shadow-sm);
      letter-spacing: -0.5px;
    }

    .empty-state {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 60px 20px;
      text-align: center;
      border: 2px dashed var(--border);
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-text {
      font-size: 17px;
      font-weight: 600;
    }

    .empty-subtext {
      font-size: 14px;
      margin-top: 6px;
    }

    /* 토스트 알림 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 1000;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* 5분 대형 타이머 카드 */
    .timer-card {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      border-radius: var(--radius);
      padding: 26px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.3), 0 8px 10px -6px rgba(15, 23, 42, 0.2);
      border: 2px solid #334155;
      animation: timerSlideDown 0.25s ease-out;
    }

    @keyframes timerSlideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .timer-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timer-title {
      font-size: 17px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timer-badge {
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .timer-badge.paused {
      background: rgba(234, 179, 8, 0.2);
      color: #fde047;
      border-color: rgba(234, 179, 8, 0.4);
    }

    .timer-badge.ended {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.5);
    }

    .timer-display {
      font-size: 88px;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, Consolas, monospace;
      color: #38bdf8;
      letter-spacing: 4px;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
      line-height: 1;
      user-select: none;
      transition: color 0.3s;
    }

    .timer-display.warning {
      color: #facc15;
      text-shadow: 0 0 25px rgba(250, 204, 21, 0.4);
    }

    .timer-display.ended {
      color: #f87171;
      text-shadow: 0 0 30px rgba(248, 113, 113, 0.6);
      animation: timerAlertPulse 1s infinite alternate;
    }

    @keyframes timerAlertPulse {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(1.05); opacity: 0.85; }
    }

    .timer-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .timer-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      font-size: 15px;
      border-radius: var(--radius-sm);
    }

    .timer-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      color: #ffffff;
    }

    /* 전체화면 모드 스타일 보정 */
    :fullscreen body {
      padding: 30px 40px;
      background-color: #f1f5f9;
    }

    :fullscreen .container {
      max-width: 1600px;
    }

    :fullscreen .groups-grid {
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    :fullscreen .student-badge {
      min-width: 70px;
      height: 56px;
      font-size: 24px;
      border-radius: 14px;
    }

    :fullscreen .group-name {
      font-size: 22px;
    }

    :fullscreen .timer-card {
      padding: 36px 48px;
    }

    :fullscreen .timer-display {
      font-size: 120px;
    }

    /* 인쇄 최적화 */
    @media print {
      body {
        background: white;
        padding: 0;
      }
      header, .settings-card, .result-actions, .toast {
        display: none !important;
      }
      .group-card {
        break-inside: avoid;
        border: 1px solid #ccc !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 상단 헤더 -->
  <header>
    <div class="title-group">
      <div class="logo-badge">🎯</div>
      <div>
        <h1>수업용 모둠 나누기</h1>
        <div class="subtitle">출석번호 무작위 자동 편성</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="fullscreenBtn" class="btn btn-outline" title="전자칠판/화면 전체화면 토글">
        ⛶ 전체화면
      </button>
      <button id="resetBtn" class="btn btn-outline" title="설정 기본값 복원">
        ↺ 초기화
      </button>
    </div>
  </header>

  <!-- 설정 패널 -->
  <section class="settings-card">
    <div class="settings-grid">
      <!-- 학생 수 설정 -->
      <div class="form-group">
        <label class="form-label" for="totalStudents">
          전체 학생 수
          <span class="hint">1번부터 마지막 번호</span>
        </label>
        <div class="number-stepper">
          <button type="button" class="stepper-btn" onclick="stepValue('totalStudents', -1)">−</button>
          <input type="number" id="totalStudents" min="2" max="60" value="25">
          <button type="button" class="stepper-btn" onclick="stepValue('totalStudents', 1)">+</button>
        </div>
      </div>

      <!-- 모둠당 인원수 설정 -->
      <div class="form-group">
        <label class="form-label" for="groupSize">
          모둠당 인원수
          <span class="hint">한 모둠에 배정할 인원</span>
        </label>
        <div class="number-stepper">
          <button type="button" class="stepper-btn" onclick="stepValue('groupSize', -1)">−</button>
          <input type="number" id="groupSize" min="2" max="20" value="4">
          <button type="button" class="stepper-btn" onclick="stepValue('groupSize', 1)">+</button>
        </div>
      </div>

      <!-- 결석/제외 번호 텍스트 입력 -->
      <div class="form-group">
        <label class="form-label" for="excludedInput">
          결석 / 제외할 번호
          <span class="hint">쉼표나 띄어쓰기로 구분</span>
        </label>
        <input type="text" id="excludedInput" class="input-control" placeholder="예: 3, 14, 21">
      </div>
    </div>

    <!-- 결석자 간편 선택 칩 -->
    <div class="chip-section">
      <div class="chip-header">
        <span class="chip-header-title">번호를 클릭하여 출석/결석을 빠르게 전환할 수 있습니다</span>
        <div class="chip-legend">
          <div class="legend-item"><span class="legend-dot present"></span> 출석</div>
          <div class="legend-item"><span class="legend-dot absent"></span> 결석/제외</div>
        </div>
      </div>
      <div id="chipsGrid" class="chips-grid"></div>
    </div>

    <!-- 실시간 요약 안내 및 실행 버튼 -->
    <div class="summary-bar">
      <div class="summary-text" id="summaryText">
        계산 중...
      </div>
      <span class="summary-badge" id="leftoverBadge">배정 계산 중</span>
    </div>

    <div class="action-cta-area">
      <button id="divideBtn" class="btn btn-primary btn-lg">
        🎲 모둠 나누기
      </button>
    </div>
  </section>

  <!-- 결과 영역 -->
  <section class="result-section">
    <div class="result-header">
      <div class="result-title">
        <span>📋 모둠 배정 결과</span>
        <span id="resultCountBadge" class="summary-badge" style="display:none;"></span>
      </div>
      <div class="result-actions">
        <button id="timerToggleBtn" class="btn btn-outline" style="display:none;" title="5분 활동 타이머">
          ⏱️ 5분 타이머
        </button>
        <button id="copyBtn" class="btn btn-outline" style="display:none;">
          📋 텍스트 복사
        </button>
        <button id="reshuffleBtn" class="btn btn-primary" style="display:none;">
          🔄 다시 섞기
        </button>
      </div>
    </div>

    <!-- 5분 대형 타이머 카드 -->
    <div id="timerCard" class="timer-card" style="display: none;">
      <div class="timer-header">
        <div class="timer-title">
          <span>⏱️ 모둠 활동 5분 타이머</span>
        </div>
        <div class="timer-badge" id="timerStatusBadge">진행 중</div>
      </div>
      <div class="timer-display" id="timerDisplay">05:00</div>
      <div class="timer-actions">
        <button type="button" id="timerStartPauseBtn" class="btn timer-btn">⏸️ 일시정지</button>
        <button type="button" id="timerResetBtn" class="btn timer-btn">↺ 5분 다시 시작</button>
        <button type="button" id="timerCloseBtn" class="btn timer-btn">✕ 닫기</button>
      </div>
    </div>

    <!-- 모둠 카드 목록이 렌더링되는 컨테이너 -->
    <div id="groupsGrid" class="groups-grid">
      <div class="empty-state" style="grid-column: 1 / -1;">
        <div class="empty-icon">🎲</div>
        <div class="empty-text">아직 모둠이 나누어지지 않았습니다.</div>
        <div class="empty-subtext">위의 <strong>'모둠 나누기'</strong> 버튼을 누르면 즉시 무작위 배정 결과가 나타납니다.</div>
      </div>
    </div>
  </section>
</div>

<!-- 토스트 알림 메시지 -->
<div id="toast" class="toast">알림</div>

<script>
  // 파스텔 테마 색상 팔레트 (모둠별 구별용)
  const PALETTES = [
    { bg: '#eff6ff', border: '#bfdbfe', header: '#dbeafe', text: '#1e40af', badgeBg: '#ffffff' }, // Blue
    { bg: '#f0fdf4', border: '#bbf7d0', header: '#dcfce7', text: '#166534', badgeBg: '#ffffff' }, // Green
    { bg: '#fff7ed', border: '#fed7aa', header: '#ffedd5', text: '#9a3412', badgeBg: '#ffffff' }, // Orange/Peach
    { bg: '#faf5ff', border: '#e9d5ff', header: '#f3e8ff', text: '#6b21a8', badgeBg: '#ffffff' }, // Purple
    { bg: '#fdf2f8', border: '#fbcfe8', header: '#fce7f3', text: '#9d174d', badgeBg: '#ffffff' }, // Pink
    { bg: '#f0fdfa', border: '#99f6e4', header: '#ccfbf1', text: '#115e59', badgeBg: '#ffffff' }, // Teal
    { bg: '#fefce8', border: '#fef08a', header: '#fef9c3', text: '#854d0e', badgeBg: '#ffffff' }, // Yellow
    { bg: '#fff1f2', border: '#fecdd3', header: '#ffe4e6', text: '#9f1239', badgeBg: '#ffffff' }, // Rose
    { bg: '#f8fafc', border: '#cbd5e1', header: '#e2e8f0', text: '#334155', badgeBg: '#ffffff' }, // Slate
    { bg: '#ecfdf5', border: '#a7f3d0', header: '#d1fae5', text: '#065f46', badgeBg: '#ffffff' }  // Emerald
  ];

  const STORAGE_KEY = 'classroom_group_divider_settings_v1';

  // 상태 관리
  let totalStudents = 25;
  let groupSize = 4;
  let excludedSet = new Set();
  let lastGroupResult = null;

  // DOM 요소
  const totalStudentsInput = document.getElementById('totalStudents');
  const groupSizeInput = document.getElementById('groupSize');
  const excludedInput = document.getElementById('excludedInput');
  const chipsGrid = document.getElementById('chipsGrid');
  const summaryText = document.getElementById('summaryText');
  const leftoverBadge = document.getElementById('leftoverBadge');
  const divideBtn = document.getElementById('divideBtn');
  const reshuffleBtn = document.getElementById('reshuffleBtn');
  const copyBtn = document.getElementById('copyBtn');
  const timerToggleBtn = document.getElementById('timerToggleBtn');
  const timerCard = document.getElementById('timerCard');
  const timerDisplay = document.getElementById('timerDisplay');
  const timerStatusBadge = document.getElementById('timerStatusBadge');
  const timerStartPauseBtn = document.getElementById('timerStartPauseBtn');
  const timerResetBtn = document.getElementById('timerResetBtn');
  const timerCloseBtn = document.getElementById('timerCloseBtn');
  const groupsGrid = document.getElementById('groupsGrid');
  const resultCountBadge = document.getElementById('resultCountBadge');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const resetBtn = document.getElementById('resetBtn');
  const toast = document.getElementById('toast');

  // 로컬 스토리지에서 이전 설정 불러오기
  function loadSettings() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        if (data.totalStudents && data.totalStudents >= 2) {
          totalStudents = parseInt(data.totalStudents, 10);
          totalStudentsInput.value = totalStudents;
        }
        if (data.groupSize && data.groupSize >= 2) {
          groupSize = parseInt(data.groupSize, 10);
          groupSizeInput.value = groupSize;
        }
        if (Array.isArray(data.excluded)) {
          excludedSet = new Set(data.excluded.filter(n => n >= 1 && n <= totalStudents));
          excludedInput.value = Array.from(excludedSet).sort((a,b)=>a-b).join(', ');
        }
      }
    } catch (e) {
      console.warn('설정 불러오기 실패:', e);
    }
  }

  // 설정 저장
  function saveSettings() {
    try {
      const data = {
        totalStudents,
        groupSize,
        excluded: Array.from(excludedSet)
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.warn('설정 저장 실패:', e);
    }
  }

  // 결석자 텍스트 입력 파싱
  function parseExcludedFromInput() {
    const raw = excludedInput.value;
    const tokens = raw.split(/[\s,]+/).map(t => parseInt(t.trim(), 10)).filter(n => !isNaN(n));
    const valid = new Set();
    tokens.forEach(num => {
      if (num >= 1 && num <= totalStudents) {
        valid.add(num);
      }
    });
    excludedSet = valid;
    renderChips();
    updateSummary();
    saveSettings();
  }

  // 칩 렌더링
  function renderChips() {
    chipsGrid.innerHTML = '';
    for (let i = 1; i <= totalStudents; i++) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = `student-chip ${excludedSet.has(i) ? 'absent' : 'present'}`;
      chip.textContent = `${i}번`;
      chip.title = excludedSet.has(i) ? `${i}번 결석 (클릭 시 출석으로 변경)` : `${i}번 출석 (클릭 시 결석 처리)`;
      chip.addEventListener('click', () => toggleStudentAttendance(i));
      chipsGrid.appendChild(chip);
    }
  }

  // 출석/결석 토글
  function toggleStudentAttendance(studentNum) {
    if (excludedSet.has(studentNum)) {
      excludedSet.delete(studentNum);
    } else {
      excludedSet.add(studentNum);
    }
    excludedInput.value = Array.from(excludedSet).sort((a,b)=>a-b).join(', ');
    renderChips();
    updateSummary();
    saveSettings();
  }

  // 실시간 예상 요약 정보 갱신
  function updateSummary() {
    const activeCount = Math.max(0, totalStudents - excludedSet.size);
    if (activeCount === 0) {
      summaryText.innerHTML = `⚠️ 출석 학생이 없습니다. 결석 번호를 조정해주세요.`;
      leftoverBadge.style.display = 'none';
      return;
    }

    let numGroups = Math.floor(activeCount / groupSize);
    if (numGroups === 0) numGroups = 1;

    const baseCount = Math.floor(activeCount / numGroups);
    const extraCount = activeCount % numGroups;

    let text = `총 <strong>${totalStudents}명</strong> 중 출석 <strong>${activeCount}명</strong>`;
    if (excludedSet.size > 0) {
      text += ` (결석 ${excludedSet.size}명 제외)`;
    }
    text += ` ➜ <strong>${numGroups}개 모둠</strong> 편성 예정`;

    summaryText.innerHTML = text;

    leftoverBadge.style.display = 'inline-block';
    if (extraCount > 0) {
      if (extraCount === 1) {
        leftoverBadge.textContent = `1모둠은 ${baseCount + 1}명, 나머지 모둠은 각 ${baseCount}명 배정`;
      } else {
        leftoverBadge.textContent = `1~${extraCount}모둠은 각 ${baseCount + 1}명, 나머지 모둠은 각 ${baseCount}명 배정`;
      }
      leftoverBadge.style.color = '#4338ca';
    } else {
      leftoverBadge.textContent = `모든 모둠 ${baseCount}명씩 균등 배정`;
      leftoverBadge.style.color = '#15803d';
    }
  }

  // 숫자 증가/감소 스텝 버튼
  window.stepValue = function(id, delta) {
    const el = document.getElementById(id);
    let val = parseInt(el.value, 10) || 0;
    val += delta;
    const min = parseInt(el.min, 10) || 1;
    const max = parseInt(el.max, 10) || 100;
    if (val < min) val = min;
    if (val > max) val = max;
    el.value = val;
    el.dispatchEvent(new Event('input'));
  };

  // Fisher-Yates 셔플 알고리즘
  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 모둠 나누기 수행
  function performDivide() {
    const activeStudents = [];
    for (let i = 1; i <= totalStudents; i++) {
      if (!excludedSet.has(i)) {
        activeStudents.push(i);
      }
    }

    if (activeStudents.length === 0) {
      showToast('⚠️ 배정할 수 있는 출석 학생이 없습니다.');
      return;
    }

    // 무작위 셔플
    const shuffled = shuffle(activeStudents);
    
    // 모둠 수 계산: 남는 인원은 앞 모둠부터 한 명씩 분산 배분
    let numGroups = Math.floor(shuffled.length / groupSize);
    if (numGroups === 0) numGroups = 1;

    const baseCount = Math.floor(shuffled.length / numGroups);
    const extraCount = shuffled.length % numGroups; // 앞 extraCount개 모둠에 1명씩 더 배정

    const groups = [];
    let currentIndex = 0;
    for (let i = 0; i < numGroups; i++) {
      const currentSize = baseCount + (i < extraCount ? 1 : 0);
      groups.push(shuffled.slice(currentIndex, currentIndex + currentSize));
      currentIndex += currentSize;
    }

    lastGroupResult = groups;
    renderResult(groups);

    // 버튼 상태 전환
    divideBtn.textContent = '🔄 다시 섞기';
    reshuffleBtn.style.display = 'inline-flex';
    copyBtn.style.display = 'inline-flex';
    timerToggleBtn.style.display = 'inline-flex';

    showToast(`🎉 총 ${groups.length}개 모둠으로 배정 완료되었습니다!`);
  }

  // 결과 카드 렌더링
  function renderResult(groups) {
    groupsGrid.innerHTML = '';
    resultCountBadge.style.display = 'inline-block';
    resultCountBadge.textContent = `총 ${groups.length}개 모둠`;

    groups.forEach((members, index) => {
      const palette = PALETTES[index % PALETTES.length];

      const card = document.createElement('div');
      card.className = 'group-card';
      card.style.backgroundColor = palette.bg;
      card.style.borderColor = palette.border;

      // 헤더
      const header = document.createElement('div');
      header.className = 'group-card-header';
      header.style.backgroundColor = palette.header;

      const title = document.createElement('div');
      title.className = 'group-name';
      title.style.color = palette.text;
      title.innerHTML = `<span>제 ${index + 1} 모둠</span>`;

      const tag = document.createElement('span');
      tag.className = 'group-size-tag';
      tag.style.color = palette.text;
      tag.textContent = `${members.length}명`;

      header.appendChild(title);
      header.appendChild(tag);
      card.appendChild(header);

      // 바디 (학생 번호 배지)
      const body = document.createElement('div');
      body.className = 'group-card-body';

      // 보기 쉽게 오름차순으로 정렬해서 표시
      const sortedMembers = [...members].sort((a,b) => a - b);

      sortedMembers.forEach(num => {
        const badge = document.createElement('div');
        badge.className = 'student-badge';
        badge.style.borderColor = palette.border;
        badge.textContent = `${num}번`;
        body.appendChild(badge);
      });

      card.appendChild(body);
      groupsGrid.appendChild(card);
    });

    // 화면 부드럽게 스크롤
    groupsGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 텍스트 복사 기능
  function copyResults() {
    if (!lastGroupResult || lastGroupResult.length === 0) {
      showToast('복사할 모둠 결과가 없습니다.');
      return;
    }

    let text = `[🎯 모둠 나누기 결과]\n`;
    text += `총 ${totalStudents}명 중 ${totalStudents - excludedSet.size}명 배정 (모둠당 ${groupSize}명 기준)\n\n`;

    lastGroupResult.forEach((members, index) => {
      const sorted = [...members].sort((a,b)=>a-b);
      text += `■ 제 ${index + 1} 모둠 (${members.length}명): ${sorted.map(n => n + '번').join(', ')}\n`;
    });

    if (excludedSet.size > 0) {
      text += `\n* 결석/제외: ${Array.from(excludedSet).sort((a,b)=>a-b).map(n => n + '번').join(', ')}`;
    }

    navigator.clipboard.writeText(text).then(() => {
      showToast('📋 결과가 클립보드에 복사되었습니다.');
    }).catch(err => {
      console.error('클립보드 복사 실패:', err);
      showToast('클립보드 복사에 실패했습니다.');
    });
  }

  // 토스트 메시지
  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  // 전체화면 토글
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().then(() => {
        fullscreenBtn.textContent = '✕ 전체화면 해제';
      }).catch(err => {
        showToast('전체화면 전환을 지원하지 않는 브라우저입니다.');
      });
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen().then(() => {
          fullscreenBtn.textContent = '⛶ 전체화면';
        });
      }
    }
  }

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      fullscreenBtn.textContent = '⛶ 전체화면';
    }
  });

  // 5분 타이머 로직
  let timerSeconds = 300; // 5분 = 300초
  let timerInterval = null;
  let isTimerRunning = false;

  function formatTime(totalSec) {
    const mins = Math.floor(totalSec / 60);
    const secs = totalSec % 60;
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }

  function updateTimerDisplay() {
    timerDisplay.textContent = formatTime(timerSeconds);

    timerDisplay.classList.remove('warning', 'ended');
    timerStatusBadge.classList.remove('paused', 'ended');

    if (timerSeconds === 0) {
      timerDisplay.classList.add('ended');
      timerStatusBadge.classList.add('ended');
      timerStatusBadge.textContent = '⏰ 시간 종료';
      timerStartPauseBtn.textContent = '↺ 5분 다시 시작';
      playTimerBeep();
      showToast('⏰ 5분 활동 시간이 종료되었습니다!');
    } else if (timerSeconds <= 60) {
      timerDisplay.classList.add('warning');
      timerStatusBadge.textContent = isTimerRunning ? '1분 미만!' : '일시정지됨';
      if (!isTimerRunning) timerStatusBadge.classList.add('paused');
    } else {
      timerStatusBadge.textContent = isTimerRunning ? '진행 중' : '일시정지됨';
      if (!isTimerRunning) timerStatusBadge.classList.add('paused');
    }
  }

  function startTimer() {
    if (timerSeconds <= 0) {
      timerSeconds = 300;
    }
    clearInterval(timerInterval);
    isTimerRunning = true;
    timerStartPauseBtn.textContent = '⏸️ 일시정지';
    updateTimerDisplay();

    timerInterval = setInterval(() => {
      if (timerSeconds > 0) {
        timerSeconds--;
        updateTimerDisplay();
        if (timerSeconds === 0) {
          clearInterval(timerInterval);
          isTimerRunning = false;
        }
      } else {
        clearInterval(timerInterval);
        isTimerRunning = false;
      }
    }, 1000);
  }

  function pauseTimer() {
    isTimerRunning = false;
    clearInterval(timerInterval);
    timerStartPauseBtn.textContent = '▶️ 계속하기';
    updateTimerDisplay();
  }

  function toggleTimerStartPause() {
    if (timerSeconds === 0) {
      resetTimer(true);
      return;
    }
    if (isTimerRunning) {
      pauseTimer();
    } else {
      startTimer();
    }
  }

  function resetTimer(autoStart = true) {
    clearInterval(timerInterval);
    isTimerRunning = false;
    timerSeconds = 300;
    timerStartPauseBtn.textContent = '⏸️ 일시정지';
    if (autoStart) {
      startTimer();
    } else {
      updateTimerDisplay();
    }
  }

  function openTimer() {
    timerCard.style.display = 'flex';
    resetTimer(true);
    timerCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    showToast('⏱️ 5분 활동 타이머가 시작되었습니다.');
  }

  function closeTimer() {
    clearInterval(timerInterval);
    isTimerRunning = false;
    timerCard.style.display = 'none';
  }

  function playTimerBeep() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    } catch (e) {}
  }

  // 초기화 기능
  function resetAll() {
    if (confirm('설정을 기본값(25명, 모둠당 4명, 결석자 없음)으로 초기화하시겠습니까?')) {
      totalStudents = 25;
      groupSize = 4;
      excludedSet.clear();
      lastGroupResult = null;

      totalStudentsInput.value = 25;
      groupSizeInput.value = 4;
      excludedInput.value = '';

      localStorage.removeItem(STORAGE_KEY);
      renderChips();
      updateSummary();

      closeTimer();

      divideBtn.textContent = '🎲 모둠 나누기';
      reshuffleBtn.style.display = 'none';
      copyBtn.style.display = 'none';
      timerToggleBtn.style.display = 'none';
      resultCountBadge.style.display = 'none';

      groupsGrid.innerHTML = `
        <div class="empty-state" style="grid-column: 1 / -1;">
          <div class="empty-icon">🎲</div>
          <div class="empty-text">아직 모둠이 나누어지지 않았습니다.</div>
          <div class="empty-subtext">위의 <strong>'모둠 나누기'</strong> 버튼을 누르면 즉시 무작위 배정 결과가 나타납니다.</div>
        </div>
      `;

      showToast('기본값으로 초기화되었습니다.');
    }
  }

  // 이벤트 리스너 바인딩
  totalStudentsInput.addEventListener('input', (e) => {
    let val = parseInt(e.target.value, 10);
    if (isNaN(val) || val < 2) val = 2;
    if (val > 100) val = 100;
    totalStudents = val;
    // 유효 범위를 벗어난 제외 번호 정리
    excludedSet.forEach(n => {
      if (n > totalStudents) excludedSet.delete(n);
    });
    excludedInput.value = Array.from(excludedSet).sort((a,b)=>a-b).join(', ');
    renderChips();
    updateSummary();
    saveSettings();
  });

  groupSizeInput.addEventListener('input', (e) => {
    let val = parseInt(e.target.value, 10);
    if (isNaN(val) || val < 2) val = 2;
    if (val > 30) val = 30;
    groupSize = val;
    updateSummary();
    saveSettings();
  });

  excludedInput.addEventListener('input', parseExcludedFromInput);
  divideBtn.addEventListener('click', performDivide);
  reshuffleBtn.addEventListener('click', performDivide);
  copyBtn.addEventListener('click', copyResults);
  timerToggleBtn.addEventListener('click', openTimer);
  timerStartPauseBtn.addEventListener('click', toggleTimerStartPause);
  timerResetBtn.addEventListener('click', () => resetTimer(true));
  timerCloseBtn.addEventListener('click', closeTimer);
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  resetBtn.addEventListener('click', resetAll);

  // 키보드 단축키 지원 (Enter로 바로 모둠 나누기 / 다시 섞기, F키로 전체화면)
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Enter' || e.code === 'Space') {
      e.preventDefault();
      performDivide();
    }
  });

  // 초기 실행
  loadSettings();
  renderChips();
  updateSummary();
</script>

</body>
</html>
